services:
  facilitator:
    build: ./facilitator
    ports:
      - "4022:4022"
    environment:
      # Required: gas wallet for onchain txs (deposit/claim/settle/refund).
      EVM_PRIVATE_KEY: ${EVM_PRIVATE_KEY:?set EVM_PRIVATE_KEY in .env or the shell}
      # Optional subset: "all" (default), "testnets", "mainnets",
      # or names like "base-sepolia,bsc-testnet".
      NETWORKS: ${NETWORKS:-all}
      # Optional per-chain RPC overrides (built-in public defaults otherwise):
      # RPC_URL_BASE_SEPOLIA, RPC_URL_BASE, RPC_URL_BSC_TESTNET, RPC_URL_BSC,
      # RPC_URL_POLYGON, RPC_URL_ARBITRUM
      EVM_RECEIVER_AUTHORIZER_PRIVATE_KEY: ${EVM_RECEIVER_AUTHORIZER_PRIVATE_KEY:-}
      # Etherscan V2 key: enables /stats history backfill on every chain.
      EXPLORER_API_KEY: ${EXPLORER_API_KEY:-}
    volumes:
      - facilitator-stats:/data
    restart: unless-stopped

volumes:
  facilitator-stats:
